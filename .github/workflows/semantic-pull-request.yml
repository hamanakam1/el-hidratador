name: Semantic PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: semantic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate the pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      # The action reports its result as a commit status.
      statuses: write
    steps:
      # The pull request head is never checked out here. The action only reads
      # the pull request title and writes a validation comment.
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          # v6 reads the token from the environment; the action only reads the
          # pull request title and writes a validation comment.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          wip: true
          validateSingleCommit: false
